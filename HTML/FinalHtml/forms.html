<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="username" placeholder="enter the username" >
      <br>
      <br>
      <label for="fname">Father Name:</label>
      <input type="text" placeholder="enter the father name" id="fname" name="fathername">
      <br>
      <br>

      <label for="age">Age:</label>
      <input type="number" placeholder="enter the age" id="age" name="userage">

      <br>
      <br>

      <label for="password">Password:</label>
      <input type="password" placeholder="enter the password" id="password" name="userpassword">

      <br>
      <br>

    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male">

    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female">

    <label for="other">Other</label>
    <input type="radio" id="other" name="gender" value="others">
      <br>
      <br>

      <label for="c++">C++</label>
      <input type="checkbox" id="c++" name="subject" value="C++">
      <label for="java"> Java </label>
      <input type="checkbox" id="java" name="subject" value="Java">
      <label for="python"> Python </label>
      <input type="checkbox" id="python" name="subject" value="Python">
          <label for="javascript"> Javascript </label>
      <input type="checkbox" id="javascript" name="subject" value="Javascript">
      <br>
      <br>
      <input type="submit">
    </form>
</body>
</html>
