<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register</p>
    <hr>

    <form >
        <h2>Personal Details</h2>
        <label for="firstname">First Name:</label>
        <input type="text" placeholder="enter the name" id="firstname" name="firstname">
        <br>
        <br>
           <label for="lastname">Last Name:</label>
        <input type="text" placeholder="enter the lastname" id="lastname" name="lastname">
        <br>
        <br>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob">
        <br>
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
             <br>
                <input type="radio" id="female" name="gender" value="Female">
                         <label for="female">Female</label>
                         <br> 
                         <input type="radio" id="other" name="gender" value="Other">
                         <label for="other">Other</label>
                         
                         <h3>Upload Your Photo:</h3>
                         <input type="file">
                         <hr>

                         <h2>
                            Contact Information
                         </h2>

                         <label for="email">Email Address:</label>
                         <input type="email" id="email" name="email" placeholder="you@example.com">
                         <br>
                         <br>
                         <label for="number">Phone Number:</label>
                         <input type="tel" id="number" placeholder="e.g. , 9876542544">
                         <br>
                         <br>

                         <label for="address">Mailing Address:</label>
                         <br>

                         <textarea rows="8" cols="12" name="Mailing Address" id="address" placeholder="Street Address, City, State, State , Zip Code"></textarea>
                         <br>
                         <br>
    
                    <hr>

                    <h2>Academic Information</h2>

                    <label for="course">Select Your Course:</label>
                    <br>
                    <select name="course" id="course">
                        <option value="Choose a Course">Choose a course</option>
                        <option value="CS">CS</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                    </select>

                    <h3>Extracurricular Interests:</h3>
                    <input type="checkbox" name="checkbox" id="checbox" value="Sports">
                    
                    <label for="checkbox">Music and Arts</label>
                    <br>
                                        <input type="checkbox" name="checkbox" id="checbox" value="Sports">
                    <label for="checkbox">Sports</label>
                    <br>

                                        <input type="checkbox" name="checkbox" id="checbox" value="Technology & Clubs">
                                        <label for="checkbox">Technology & Clubs</label>
                                        <br>

                                        <input type="checkbox" name="checkbox" id="checkbox" value="Volunteering">
                                        <label for="checkbox">Volunteering</label>
                                        <hr>

                                        <h3> Create your account</h3>

                                        <label for="password">Create a Password</label>
                                        <input type="password" name="password" id="password">
<br>

                                        <label for="question">Security  Question:</label>
                                        <select name="question" id="question">
                                            <option value="What was your first pet's name">What was your first pet's name</option>
                                            <option value="Dog">Dog</option>
                                            <option value="Cat">Cat</option>
                                        </select>   
                                        <br>
                                        <br>

                                        <label for="pass">Create a Password:</label>

                                        <input type="text">

                                        <br>
                                        <input type="checkbox" name="checkbox" id="checkbox">
                                        <label for="checkbox">I agree to the terms and Conditions:</label>

                                        <hr>
                                        <button type="submit">Register</button>
                                        <button type="submit">Clear</button>
                                        <hr>
                                                     



            </form>

</body>
</html>
