<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>
    <hr>
    <form>
        <h2>Personal Details</h2>
        <label for="name">First Name:</label>
        <input type="text" name="Username" placeholder="e.g. Arjun" id="name">
        <br>
        <br>
        
        <label for="lastname">Last Name:</label>
        <input type="text" name="lastname" placeholder="e.g. Kumar" id="lastname">
        <br><br>
        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date">
        <br>
        <br>
        <h1>Gender:</h1>
        <label for="radio">Male</label>
        <input type="radio" id="radio" name="gender" value="male" >
         <label for="radio">Female</label>
        <input type="radio" id="radio" name="gender" value="female" >
         <label for="radio">Other</label>
        <input type="radio" id="radio" name="gender" value="Other">
        <br><br>

    <h2>Upload Your Photo </h2> 
    <input type="file" name="UserFile" >
    <br>
    <br>
    <hr>

    <h2>Contact Information</h2>
    <label for="email">Email Address:</label>
    <input type="email" placeholder="you@example.com" id="email">
    <br>
    <br>
    <label for="number">Phone Number:</label>
    <input type="number" placeholder="e.g.; 98792797567" id="number">
    <br>
    <br>


    <label for="mail">Mailing Address</label>
    <br>
    <textarea name="email address" id="mail"  rows="6" cols="16" placeholder="Street Address,City" ></textarea>
    <br>
    <br>
 
    <hr>
    <h2>Academic Infomation</h2>
    <label for="courses">Select Your Course:</label>
    <select id="courses" name="course">
        <option value="">Choose a course</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
         <option value="javascript">javascript</option>
    </select>
    <br><br>

    <p>Extracurricular Interests:</p>
    <label for="activities">Sports</label>
    <input type="checkbox" name="interest"  id="activities" value="Sports">
      <label for="activities">Music & Arts</label>
    <input type="checkbox" name="interest"  id="activities" value="Music & Arts">
      <label for="activities">Technology Clubs</label>
    <input type="checkbox" name="interest"  id="activities" value="Volunteering">
      <label for="activities">Technology Clubs</label>
    <input type="checkbox" name="interest"  id="activities" value="Technology Clubs">
    <br>
    <br>
    <hr>

    <h2>Create Your Account</h2>
    <label for="password"> Create a Password:</label>
    <input type="password" id="password">
    <br><br>
    <!-- dropdown -->
     <label for="question">Security Question:</label>
     <select name="question" id="question">
        <option value="">What was your first pet's name?</option>
        <option value="dog">Dog</option>
         <option value="cat">Cat</option>
          <option value="puppy">Puppy</option>
          <option value="parrot">Parrot</option>
     </select>
     <br>
     <br>

     <label for="question">Security Answer:</label>
     <input type="text">
     <br><br>
     <input type="checkbox" id="checkbox" required>
     <label for="checkbox">I agree to the Terms and Conditions:</label>
     <br><br>
     <hr>
     <input type="submit" value="Register">
      <input type="reset" value="Clear Form">

      <br><br>
      
    </form>
</body>
</html>
